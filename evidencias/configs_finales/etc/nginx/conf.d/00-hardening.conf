# /etc/nginx/conf.d/00-hardening.conf   (contexto http — se incluye desde nginx.conf)
# OJO: ssl_protocols y ssl_prefer_server_ciphers YA existen en el bloque http de
# /etc/nginx/nginx.conf en Ubuntu; repetirlos aquí da "directive is duplicate".
# Por eso el TLS se fija a nivel server en snippets/seguridad-sitio.conf.

# server_tokens: Ubuntu 26.04 ya trae "server_tokens build;" en nginx.conf (repetirlo aquí
# da "directive is duplicate"), así que se cambia allí a "off" (ver 04_hardening_servicio.sh).

# Límite de tasa por IP (lo usa cada vhost con limit_req)
limit_req_zone $binary_remote_addr zone=por_ip:10m rate=10r/s;
limit_req_status 429;

# Formato de log con tiempos: request_time (total) y upstream_response_time (lo que tardó PHP-FPM)
log_format lemp '$remote_addr - $remote_user [$time_local] "$host" "$request" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                'rt=$request_time urt=$upstream_response_time';
