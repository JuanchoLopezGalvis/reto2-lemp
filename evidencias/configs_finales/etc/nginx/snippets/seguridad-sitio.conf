# /etc/nginx/snippets/seguridad-sitio.conf   (contexto server — incluir en cada vhost 443)

# Solo TLS modernos (TLS 1.0/1.1 quedan rechazados)
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

# Encabezados de seguridad ("always" = también en respuestas de error)
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# CSP: solo recursos del propio sitio. 'unsafe-inline' en style/script porque la app del equipo
# usa <style> y un onclick="confirm(...)" en línea (sin él, "Eliminar" borraría sin confirmar).
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; form-action 'self'" always;

# Tamaño máximo de cuerpo de petición
client_max_body_size 2m;

# Límite de tasa (zona definida en conf.d/00-hardening.conf)
limit_req zone=por_ip burst=20 nodelay;

# Bloquear archivos/directorios ocultos (.git, .env, .htaccess...)
location ~ /\. {
    deny all;
}
