; /etc/php/8.5/fpm/conf.d/99-hardening.ini
; No anunciar la versión de PHP (encabezado X-Powered-By)
expose_php = Off
; Errores al log, nunca al navegador
display_errors = Off
display_startup_errors = Off
log_errors = On
; Cookies de sesión: solo por HTTPS, inaccesibles a JavaScript, sin IDs impuestos
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.use_strict_mode = 1
