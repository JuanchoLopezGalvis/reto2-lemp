; /etc/php/8.5/fpm/pool.d/sitio1.conf
[sitio1]
; Los procesos PHP de sitio1 corren con su propio usuario de sistema
user = www-sitio1
group = www-sitio1

; Socket exclusivo. Nginx (workers como www-data) debe poder escribir en él:
listen = /run/php/php8.5-fpm-sitio1.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Solo puede leer su propio webroot y el directorio de sesiones (no el del otro sitio)
php_admin_value[open_basedir] = /var/www/sitio1:/var/lib/php/sessions:/tmp
catch_workers_output = yes
