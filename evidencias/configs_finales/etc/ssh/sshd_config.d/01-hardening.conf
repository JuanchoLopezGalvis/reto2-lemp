# /etc/ssh/sshd_config.d/01-hardening.conf
# El prefijo 01- es intencional: sshd usa el PRIMER valor que lee de cada directiva,
# y los archivos de sshd_config.d se leen en orden alfabético (50-cloud-init.conf
# puede traer "PasswordAuthentication yes").
# ⚠️ Aplicar SOLO después de confirmar que el login por llave funciona.

PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
# Ajustar con los usuarios reales que administran el servidor:
AllowUsers juandi
